# ─────────────────────────────────────────────────────────────
# TLP Config — ASUS K5504VN (i9-13900H)
# CPU domain handled by auto-cpufreq — TLP handles peripherals only
# ─────────────────────────────────────────────────────────────

# ── CPU (DISABLED — auto-cpufreq owns this domain) ──
# Empty strings tell TLP to skip these tunables entirely
CPU_SCALING_GOVERNOR_ON_AC=""
CPU_SCALING_GOVERNOR_ON_BAT=""
CPU_ENERGY_PERF_POLICY_ON_AC=""
CPU_ENERGY_PERF_POLICY_ON_BAT=""
CPU_BOOST_ON_AC=""
CPU_BOOST_ON_BAT=""
CPU_HWP_DYN_BOOST_ON_AC=""
CPU_HWP_DYN_BOOST_ON_BAT=""
PLATFORM_PROFILE_ON_AC=""
PLATFORM_PROFILE_ON_BAT=""
CPU_SCALING_MAX_FREQ_ON_AC=""
CPU_SCALING_MAX_FREQ_ON_BAT=""
CPU_SCALING_MIN_FREQ_ON_AC=""
CPU_SCALING_MIN_FREQ_ON_BAT=""
CPU_MAX_PERF_ON_AC=""
CPU_MAX_PERF_ON_BAT=""
CPU_MIN_PERF_ON_AC=""
CPU_MIN_PERF_ON_BAT=""
CPU_DRIVER_OPMODE_ON_AC=""
CPU_DRIVER_OPMODE_ON_BAT=""

# ── PCIe ASPM ──
PCIE_ASPM_ON_AC=performance
PCIE_ASPM_ON_BAT=powersupersave

# ── Runtime PM for PCIe devices ──
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ── USB ──
USB_AUTOSUSPEND=0
USB_EXCLUDE_AUDIO=1
USB_DENYLIST="3-9.2 3-9.3"

# ── WiFi ──
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ── Sound ──
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# ── Misc ──
NMI_WATCHDOG=0
WOL_DISABLE=Y
